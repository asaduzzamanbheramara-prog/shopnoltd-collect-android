name: ShopnoltdCollect Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopnoltd-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Run unit tests
        run: |
          ./gradlew test \
            --no-daemon \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            --max-workers=2 \
            --stacktrace

      # Always produce an installable, reproducible QA APK. The normal release
      # variant may be unsigned when release signing secrets are not configured;
      # selfSignedRelease is intentionally used for CI distribution/testing.
      - name: Build installable QA APK
        run: |
          ./gradlew :collect_app:assembleSelfSignedRelease \
            --no-daemon \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            --max-workers=2 \
            --stacktrace

      - name: Verify APK output
        run: |
          set -euo pipefail
          apk="$(find collect_app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          test -s "$apk"
          echo "APK=$apk"
          sha256sum "$apk" | tee collect_app/build/outputs/apk/ShopnoltdCollect-SHA256.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopnoltd-android-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShopnoltdCollect-installable-qa-apk
          path: |
            collect_app/build/outputs/apk/selfSignedRelease/*.apk
            collect_app/build/outputs/apk/ShopnoltdCollect-SHA256.txt
          if-no-files-found: error
          retention-days: 30
